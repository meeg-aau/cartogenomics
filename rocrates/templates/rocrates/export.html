<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Export RO-Crate — Cartogenomics</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 720px;">
  <h1 class="h3 mb-1">Export RO-Crate</h1>
  <p class="text-muted mb-4">Select filters and submit to queue an export. You will be redirected to a status page where you can download the zip when it is ready.</p>

  <form method="post">
    {% csrf_token %}

    <div class="card mb-3">
      <div class="card-header fw-semibold">Sample filters</div>
      <div class="card-body">
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" name="include_samples" id="include_samples" checked>
          <label class="form-check-label" for="include_samples">Include samples</label>
        </div>
        <div id="sample-fields">
          <div class="row g-3 mb-3">
            <div class="col-sm-6">
              <label class="form-label">Source dataset</label>
              <select name="source_dataset" class="form-select">
                <option value="">— all —</option>
                {% for value, label in source_datasets %}
                  <option value="{{ value }}">{{ label }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-sm-6">
              <label class="form-label">Release label</label>
              <input type="text" name="release_label" class="form-control" placeholder="e.g. 1.0">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Ontology (substring match)</label>
            <input type="text" name="ontology" class="form-control" placeholder="e.g. forest">
          </div>
          <div class="row g-3 mb-3">
            <div class="col-6 col-sm-3">
              <label class="form-label">Lat min</label>
              <input type="number" step="any" name="lat_min" class="form-control" placeholder="e.g. 54.0">
            </div>
            <div class="col-6 col-sm-3">
              <label class="form-label">Lat max</label>
              <input type="number" step="any" name="lat_max" class="form-control" placeholder="e.g. 58.0">
            </div>
            <div class="col-6 col-sm-3">
              <label class="form-label">Lon min</label>
              <input type="number" step="any" name="lon_min" class="form-control" placeholder="e.g. 8.0">
            </div>
            <div class="col-6 col-sm-3">
              <label class="form-label">Lon max</label>
              <input type="number" step="any" name="lon_max" class="form-control" placeholder="e.g. 15.0">
            </div>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="include_runs" id="include_runs" checked>
            <label class="form-check-label" for="include_runs">Include sequencing runs</label>
          </div>
        </div>
      </div>
    </div>

    <div class="card mb-3">
      <div class="card-header fw-semibold">Genome filters</div>
      <div class="card-body">
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" name="include_genomes" id="include_genomes">
          <label class="form-check-label" for="include_genomes">Include genomes</label>
        </div>
        <div id="genome-fields" class="d-none">
          <div class="row g-3">
            <div class="col-sm-4">
              <label class="form-label">Genome release label</label>
              <input type="text" name="genome_release_label" class="form-control" placeholder="e.g. 1.0">
            </div>
            <div class="col-sm-4">
              <label class="form-label">Min completeness</label>
              <input type="number" step="any" name="min_completeness" class="form-control" placeholder="e.g. 90">
            </div>
            <div class="col-sm-4">
              <label class="form-label">Max contamination</label>
              <input type="number" step="any" name="max_contamination" class="form-control" placeholder="e.g. 5">
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-header fw-semibold">Export options</div>
      <div class="card-body">
        <label class="form-label">Crate label <span class="text-muted">(optional)</span></label>
        <input type="text" name="label" class="form-control" placeholder="Auto-generated if left blank">
      </div>
    </div>

    <button type="submit" class="btn btn-primary">Queue export</button>
  </form>
</div>

<script>
  document.getElementById("include_genomes").addEventListener("change", function () {
    document.getElementById("genome-fields").classList.toggle("d-none", !this.checked);
  });
  document.getElementById("include_samples").addEventListener("change", function () {
    document.getElementById("sample-fields").classList.toggle("d-none", !this.checked);
  });
</script>
</body>
</html>
